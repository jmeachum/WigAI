name: PR Validation

on:
  pull_request:

permissions:
  contents: read

jobs:
  # Check if code files were changed to determine if we need to run tests
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      should-test: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!*.md'
              - '!**/*.md'
              - '!.gitignore'
              - '!LICENSE'
              - '!.bmad/**'
              - '!.claude/**'
              - '!.continue/**'
              - '!.github/**'
              - '!.roo/**'

  test:
    name: Test
    needs: check-changes
    runs-on: ubuntu-latest
    steps:
      - name: Skip (no code changes)
        if: ${{ needs.check-changes.outputs.should-test != 'true' }}
        run: echo "No code changes detected; skipping tests."

      - name: Checkout code
        if: ${{ needs.check-changes.outputs.should-test == 'true' }}
        uses: actions/checkout@v4

      - name: Set up JDK 21
        if: ${{ needs.check-changes.outputs.should-test == 'true' }}
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        if: ${{ needs.check-changes.outputs.should-test == 'true' }}
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        if: ${{ needs.check-changes.outputs.should-test == 'true' }}
        run: ./gradlew test

  build:
    name: Build
    needs: [check-changes, test]
    runs-on: ubuntu-latest
    steps:
      - name: Skip (no code changes)
        if: ${{ needs.check-changes.outputs.should-test != 'true' }}
        run: echo "No code changes detected; skipping build."

      - name: Checkout code
        if: ${{ needs.check-changes.outputs.should-test == 'true' }}
        uses: actions/checkout@v4

      - name: Set up JDK 21
        if: ${{ needs.check-changes.outputs.should-test == 'true' }}
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        if: ${{ needs.check-changes.outputs.should-test == 'true' }}
        uses: gradle/actions/setup-gradle@v4

      - name: Build extension
        if: ${{ needs.check-changes.outputs.should-test == 'true' }}
        run: ./gradlew bwextension -x test

      - name: Set artifact name
        id: set-artifact-name
        if: ${{ needs.check-changes.outputs.should-test == 'true' }}
        run: |
          if [ -n "${{ github.event.number }}" ]; then
            echo "name=WigAI.bwextension-pr-${{ github.event.number }}" >> $GITHUB_OUTPUT
          else
            echo "name=WigAI.bwextension-${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Upload extension artifact
        if: ${{ needs.check-changes.outputs.should-test == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.set-artifact-name.outputs.name }}
          path: build/extensions/WigAI.bwextension
          retention-days: 7

  # Always-passing job that summarizes the validation status
  validation-summary:
    runs-on: ubuntu-latest
    needs: [check-changes, test, build]
    if: always()
    steps:
      - name: Report validation status
        run: |
          if [[ "${{ needs.check-changes.outputs.should-test }}" == "false" ]]; then
            echo "✅ No code changes detected - skipping tests"
            echo "Changed files are documentation or configuration only"
            exit 0
          elif [[ "${{ needs.test.result }}" == "success" && "${{ needs.build.result }}" == "success" ]]; then
            echo "✅ All tests passed"
            exit 0
          else
            echo "❌ Validation failed"
            exit 1
          fi
